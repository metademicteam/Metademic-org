[project]
name = "racn-node"
version = "0.1.0"
description = "RACN peer node — P2P prompt → coordinator → best-GPU generate()"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["websockets>=12", "requests>=2.31", "click>=8.1"]

[project.scripts]
racn-node = "racn_node.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racn_node"]
